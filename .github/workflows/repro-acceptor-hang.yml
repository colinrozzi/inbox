name: repro-acceptor-hang

# Cutover-debug repro (workflow_dispatch) for the 0.10.2 mail-spine flip failure.
# The prior fixed-size run showed acceptor boots at 250B AND at 1949B init-state
# (init body ran) — so the composite_abi decode knee is ABOVE ~1.9KB. This sweeps
# the init-state SIZE to (1) actually reproduce the hang, (2) bracket the knee /
# curve for pack-dev, and (3) run theater-dev's test C: a size that HANGS at 8MiB,
# re-run at 64MiB.
#   reached_init=YES -> guest decoded the state + ran init body (fast).
#   reached_init=NO + rc=137 -> HUNG in the composite_abi decode (killed at 150s).
# (Sub-manifest refs are fake, so a booting init errors at the sub-actor spawn —
#  well after its line-143 log — which is the reached_init=YES signal.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Sweep init-state size on theater 0.10.2 (8MiB + 64MiB / test C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build composites (8MiB + 64MiB) + the pinned 0.10.2 theater binary
        run: |
          nix build .#default        -o result-composites
          nix build .#composites-64m -o result-composites-64m
          nix build .#theater        -o result-theater
          ./result-theater/bin/theater --version || true

      - name: Sweep state size (find the knee + test C at 64MiB)
        run: |
          set -uo pipefail
          set +e   # GitHub injects set -e; a timeout-killed spawn must not abort the step
          THEATER="$PWD/result-theater/bin/theater"
          C8="$PWD/result-composites"; C64="$PWD/result-composites-64m"
          WORK="$RUNNER_TEMP/repro"; mkdir -p "$WORK/store"

          HANDLERS='[[handler]]
          type = "runtime"
          [[handler]]
          type = "tcp"
          [[handler]]
          type = "supervisor"
          [[handler]]
          type = "rpc"
          [[handler]]
          type = "store"
          base_path = "'"$WORK/store"'"
          store_id = "inbox"'

          mkstate () {
            printf '{"bearer_token":"x","dkim_private_key":"%s","listen_addr":"127.0.0.1:0","api_handler_manifest":"/tmp/n.toml","mailbox_manifest":"/tmp/n.toml","router_manifest":"/tmp/n.toml","smtp_acceptor_manifest":"/tmp/n.toml","smtp_handler_manifest":"/tmp/n.toml"}' "$1"
          }

          RESULTS="$WORK/sweep.txt"; : > "$RESULTS"
          run () {
            label="$1"; comp="$2"; nbytes="$3"; memtag="$4"
            dkim="$(head -c "$nbytes" < /dev/zero | tr '\0' 'A')"
            state="$(mkstate "$dkim")"
            man="$WORK/$label.manifest.toml"
            { echo "name = \"acc\""; echo "version = \"0.1.0\""; echo "package = \"$comp\""
              echo "initial_state = '$state'"; printf '%s\n' "$HANDLERS"; } > "$man"
            log="$WORK/$label.log"
            t0=$(date +%s%3N)
            timeout --signal=KILL 150 env RUST_LOG=info "$THEATER" spawn "$man" > "$log" 2>&1
            rc=$?
            t1=$(date +%s%3N); el=$((t1 - t0))
            if grep -qF "[inbox-acceptor] init" "$log"; then reached=YES; else reached=NO; fi
            tag=ok; { [ "$rc" = 137 ] && [ "$reached" = NO ]; } && tag=HUNG
            line=$(printf 'SWEEP mem=%-4s state=%7dB reached_init=%-3s rc=%-4s elapsed=%7dms %s' \
              "$memtag" "${#state}" "$reached" "$rc" "$el" "$tag")
            echo "$line" | tee -a "$RESULTS"
          }

          echo "===== 8MiB: size sweep (bracket the knee) ====="
          for n in 2048 4096 8192 16384 32768 65536; do run "m8_$n" "$C8/inbox_acceptor.composite.wasm" "$n" 8M; done

          echo "===== 64MiB: test C (same sizes; do the same states boot with headroom?) ====="
          for n in 16384 32768 65536; do run "m64_$n" "$C64/inbox_acceptor.composite.wasm" "$n" 64M; done

          echo "==================== SWEEP TABLE ===================="
          cat "$RESULTS"
          echo "===================================================="
          echo "READ: the smallest 8MiB size with reached_init=NO/HUNG is the knee."
          echo "TEST C: if that size (or larger) HANGS at 8MiB but reached_init=YES at 64MiB"
          echo "        => memory-grow-thrash, interim --initial-memory bump unblocks the flip."
          echo "        If it HANGS at 64MiB too => algorithmic O(n^2), wait for pack-dev."

      - name: Upload spawn logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-spawn-logs
          path: ${{ runner.temp }}/repro/*.log
          retention-days: 7
