name: repro-acceptor-hang

# Cutover-debug repro (workflow_dispatch) for the 0.10.2 mail-spine flip failure.
# Spawns inbox composites on the pinned 0.10.2 theater (7daab2ad) under
# RUST_LOG=trace with a hard timeout and reports which reach their guest init
# log line vs hang before it. Runs theater-dev's discriminating matrix:
#
#   B (highest signal): acceptor's REAL composite with a TINY vs a FULL
#     (~1.7KB DKIM-sized) initial_state, SAME surface. tiny boots + full hangs
#     => the spin is composite_abi Value-decode cost scaling with state size.
#   A (surface contrast): mailbox (same state:value + GraphValue-return shape,
#     SMALLER surface + simpler handlers). Boots => not surface-driven.
#
# The last theater-side trace frame should be the actor.init export call
# (handoff clean) — printed below so theater-dev can confirm the hang is
# bounded to the guest entry.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Spawn inbox composites on theater 0.10.2 (trace + timeout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build composites (8MiB + 64MiB) + the pinned 0.10.2 theater binary
        run: |
          nix build .#default        -o result-composites       # 8MiB  (deployable)
          nix build .#composites-64m -o result-composites-64m    # 64MiB (test C only)
          nix build .#theater        -o result-theater
          echo "=== 8MiB composites ==="; ls -la result-composites/
          echo "=== 64MiB composites ==="; ls -la result-composites-64m/
          echo "=== theater version ==="; ./result-theater/bin/theater --version || true

      - name: Spawn matrix (tiny vs full acceptor state + mailbox contrast)
        run: |
          set -uo pipefail
          # GitHub Actions injects `set -e`; disable it so a timeout-killed spawn
          # (exit 137) or an init-Err spawn (exit 1) doesn't abort the step before
          # we record each case's result and run the remaining cases.
          set +e
          THEATER="$PWD/result-theater/bin/theater"
          COMP="$PWD/result-composites"
          WORK="$RUNNER_TEMP/repro"; mkdir -p "$WORK/store"

          # initial_state JSON with a parameterized dkim_private_key size. The
          # hang is BEFORE init's body reads any of this, so values/validity do
          # not matter — only the encoded value SIZE that composite_abi decodes.
          mkstate () {
            printf '{"bearer_token":"x","dkim_private_key":"%s","listen_addr":"127.0.0.1:0","api_handler_manifest":"/tmp/n.toml","mailbox_manifest":"/tmp/n.toml","router_manifest":"/tmp/n.toml","smtp_acceptor_manifest":"/tmp/n.toml","smtp_handler_manifest":"/tmp/n.toml"}' "$1"
          }
          TINY_DKIM="y"
          FULL_DKIM="$(head -c 1700 < /dev/zero | tr '\0' 'A')"   # ~1.7KB, prod DKIM PEM size

          ACCEPTOR_HANDLERS='[[handler]]
          type = "runtime"
          [[handler]]
          type = "tcp"
          [[handler]]
          type = "supervisor"
          [[handler]]
          type = "rpc"
          [[handler]]
          type = "store"
          base_path = "'"$WORK/store"'"
          store_id = "inbox"'

          MAILBOX_HANDLERS='[[handler]]
          type = "runtime"
          [[handler]]
          type = "store"
          base_path = "'"$WORK/store"'"
          store_id = "inbox"'

          run_case () {
            label="$1"; comp="$2"; marker="$3"; handlers="$4"; state="$5"
            man="$WORK/$label.manifest.toml"
            {
              echo "name = \"$label\""
              echo "version = \"0.1.0\""
              echo "package = \"$comp\""
              echo "initial_state = '$state'"
              printf '%s\n' "$handlers"
            } > "$man"
            echo "==================== CASE: $label (state ${#state} bytes) ===================="
            log="$WORK/$label.log"
            timeout --signal=KILL 90 env RUST_LOG=trace "$THEATER" spawn "$man" > "$log" 2>&1
            rc=$?
            echo "exit=$rc  (137 => killed by timeout => did not return in 90s)"
            if grep -qF "$marker" "$log"; then
              echo "RESULT[$label]: init marker '$marker' FOUND -> guest init body RAN"
            else
              echo "RESULT[$label]: init marker '$marker' ABSENT -> HUNG before init body"
            fi
            echo "--- last theater-side frames (init/export/invoke/spawn/actor) ---"
            grep -iE "init|export|invoke|spawn|actor|load|memory|grow" "$log" | tail -25 || true
            echo "--- last 30 raw log lines ---"; tail -30 "$log" || true
            echo
          }

          COMP64="$PWD/result-composites-64m"

          # B: fixed surface (real acceptor composite, 8MiB), vary state size.
          run_case acceptor-TINY    "$COMP/inbox_acceptor.composite.wasm"   "[inbox-acceptor] init" "$ACCEPTOR_HANDLERS" "$(mkstate "$TINY_DKIM")"
          run_case acceptor-FULL    "$COMP/inbox_acceptor.composite.wasm"   "[inbox-acceptor] init" "$ACCEPTOR_HANDLERS" "$(mkstate "$FULL_DKIM")"
          # A: surface contrast (smaller surface, 8MiB, tiny state).
          run_case mailbox-TINY     "$COMP/inbox_mailbox.composite.wasm"    "[inbox-mailbox]"       "$MAILBOX_HANDLERS"  "$(mkstate "$TINY_DKIM")"
          # C: full state on the 64MiB-memory acceptor composite — headroom vs algorithmic.
          run_case acceptor-FULL-64m "$COMP64/inbox_acceptor.composite.wasm" "[inbox-acceptor] init" "$ACCEPTOR_HANDLERS" "$(mkstate "$FULL_DKIM")"

          echo "==================== SUMMARY ===================="
          for c in acceptor-TINY acceptor-FULL mailbox-TINY acceptor-FULL-64m; do
            m="[inbox-acceptor] init"; [ "$c" = mailbox-TINY ] && m="[inbox-mailbox]"
            if grep -qF "$m" "$WORK/$c.log"; then echo "$c: init body RAN"; else echo "$c: HUNG before init body"; fi
          done
          echo "INTERPRETATION:"
          echo "  acceptor-TINY boots + acceptor-FULL hangs => decode cost scales with state size (B)"
          echo "  mailbox-TINY boots                        => not surface-driven (A)"
          echo "  acceptor-FULL-64m boots                   => memory-grow-thrash; interim --initial-memory bump can unblock the flip (C)"
          echo "  acceptor-FULL-64m still hangs             => algorithmic O(n^2); mail spine waits for pack-dev's fix (C)"

      - name: Upload spawn logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-spawn-logs
          path: ${{ runner.temp }}/repro/*.log
          retention-days: 7
