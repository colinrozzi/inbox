name: Release

on:
  # Developer-initiated: `nix run .#release` from main (or `git tag release-*`
  # + push) creates the tag. The tag push triggers this workflow. No
  # auto-trigger on every main commit — release is an explicit step.
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build + tag + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Workspace build sanity check. Blocks the release if main does not
      # compile. Produces result/ with the six wasm actors (the CLI is now a
      # native binary released separately via release-cli.yml).
      - name: Build workspace
        run: nix build

      - name: Create GitHub release and upload artifacts
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            DATE=$(date +%Y%m%d)
            SHA=$(git rev-parse --short=7 HEAD)
            TAG="release-$DATE-$SHA"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --generate-notes

          STAGE_TAG="${TAG#release-}"
          ASSETS=()
          REPO="${{ github.repository }}"

          # 1) Per-actor wasms — each as its own release asset with a
          #    stage-tagged filename. Sentinel's `package` field points at
          #    one of these (inbox_acceptor) directly. The acceptor's
          #    initial_state JSON references the sub-manifest URLs below;
          #    each sub-manifest's package field in turn points at its
          #    corresponding wasm asset.
          for actor in \
            inbox_acceptor \
            inbox_api_handler \
            inbox_mailbox \
            inbox_mailbox_router \
            inbox_smtp_acceptor \
            inbox_smtp_handler
          do
            # nix build emits plain self-contained actor modules (packr 0.11.0); the
            # deployable artifact is <actor>.wasm, not a bare member.
            # Release assets + the sub-manifest package URLs below use the
            # <actor>-<tag>.wasm name so the deployable is unambiguous.
            cp "$(realpath result)/${actor}.wasm" "${actor}-${STAGE_TAG}.wasm"
            chmod +w "${actor}-${STAGE_TAG}.wasm"
            ASSETS+=("${actor}-${STAGE_TAG}.wasm")
          done

          # 2) Sub-manifest TOMLs for the five sub-actors, DERIVED from the
          #    in-repo <actor>/manifest.toml (the tested source of truth) via the
          #    shared ops/derive-manifest.sh: repoint `package` at this release's
          #    wasm asset (static_package=true) + inject the deploy-only TLS
          #    stanzas the skeletons omit. Handler sets + permission_policy come
          #    straight from the in-repo manifests, so they can't drift. The SAME
          #    script + ops/inbox-actors.json (the canonical actor set) are reused
          #    by the fleet store's `store publish` with a store package_ref --
          #    one transform, no forks.
          while read -r actor dir wasm tls; do
            url="https://github.com/${REPO}/releases/download/${TAG}/${wasm}-${STAGE_TAG}.wasm"
            out="inbox-${actor}-${STAGE_TAG}.toml"
            sh ops/derive-manifest.sh "$dir" "$tls" "$url" > "$out"
            ASSETS+=("$out")
          done < <(jq -r '.[] | "\(.actor) \(.dir) \(.wasm) \(.tls)"' ops/inbox-actors.json)

          # Index so consumers (store publish, etc.) can iterate the published set
          # without hardcoding names.
          INDEX="inbox-manifest-index-${STAGE_TAG}.json"
          jq --arg st "${STAGE_TAG}" \
            '[.[] | {actor, wasm: "\(.wasm)-\($st).wasm", manifest: "inbox-\(.actor)-\($st).toml", tls}]' \
            ops/inbox-actors.json > "$INDEX"
          ASSETS+=("$INDEX")

          # 3) Bundle of all six actor modules (humans / local use) + sha256.
          STAGE="inbox-${STAGE_TAG}-wasm32"
          mkdir -p "$STAGE"
          for actor in \
            inbox_acceptor \
            inbox_api_handler \
            inbox_mailbox \
            inbox_mailbox_router \
            inbox_smtp_acceptor \
            inbox_smtp_handler
          do
            cp "$(realpath result)/${actor}.wasm" "$STAGE/"
          done
          chmod -R +w "$STAGE"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

          gh release upload "$TAG" "${ASSETS[@]}" "$STAGE.tar.gz" "$STAGE.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
