name: Release

on:
  # Developer-initiated: `nix run .#release` from main (or `git tag release-*`
  # + push) creates the tag. The tag push triggers this workflow. No
  # auto-trigger on every main commit — release is an explicit step.
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build + tag + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Workspace build sanity check. Blocks the release if main does not
      # compile. Produces result/ with the six wasm actors (the CLI is now a
      # native binary released separately via release-cli.yml).
      - name: Build workspace
        run: nix build

      - name: Create GitHub release and upload artifacts
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            DATE=$(date +%Y%m%d)
            SHA=$(git rev-parse --short=7 HEAD)
            TAG="release-$DATE-$SHA"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --generate-notes

          STAGE_TAG="${TAG#release-}"
          ASSETS=()
          REPO="${{ github.repository }}"

          # 1) Per-actor wasms — each as its own release asset with a
          #    stage-tagged filename. Sentinel's `package` field points at
          #    one of these (inbox_acceptor) directly. The acceptor's
          #    initial_state JSON references the sub-manifest URLs below;
          #    each sub-manifest's package field in turn points at its
          #    corresponding wasm asset.
          for actor in \
            inbox_acceptor \
            inbox_api_handler \
            inbox_mailbox \
            inbox_mailbox_router \
            inbox_smtp_acceptor \
            inbox_smtp_handler
          do
            # nix build emits plain self-contained actor modules (packr 0.11.0); the
            # deployable artifact is <actor>.wasm, not a bare member.
            # Release assets + the sub-manifest package URLs below use the
            # <actor>-<tag>.wasm name so the deployable is unambiguous.
            cp "$(realpath result)/${actor}.wasm" "${actor}-${STAGE_TAG}.wasm"
            chmod +w "${actor}-${STAGE_TAG}.wasm"
            ASSETS+=("${actor}-${STAGE_TAG}.wasm")
          done

          # 2) Sub-manifest TOMLs for the five sub-actors, DERIVED from the
          #    in-repo <actor>/manifest.toml (the tested post-cutover truth) so
          #    they can never drift: copy the manifest, repoint `package` at
          #    this release's matching wasm asset (static_package=true), and
          #    inject the deploy-only TLS stanzas the in-repo skeletons omit
          #    (client_tls on api-handler for outbound STARTTLS; server_tls on
          #    smtp-handler for :25 STARTTLS). Handler sets + permission_policy
          #    come straight from the in-repo manifests -- no hand-maintained
          #    copies to rot. (The old heredocs had fallen ~3 revs behind: a
          #    dead `supervisor` handler, a missing `self`, a wrong `runtime`.)
          derive_manifest() {
            local actor_dir="$1" wasm_name="$2" tls="$3" out="$4"
            local url="https://github.com/${REPO}/releases/download/${TAG}/${wasm_name}-${STAGE_TAG}.wasm"
            awk -v url="$url" -v tls="$tls" '
              /^package = /        { print "package = \"" url "\""; print "static_package = true"; next }
              /^static_package = / { next }
              { print }
              /^type = "tcp"$/ {
                if (tls == "client") { print ""; print "[handler.client_tls]"; print "enabled = true"; print "auto_handshake = false" }
                else if (tls == "server") { print ""; print "[handler.server_tls]"; print "enabled = true"; print "cert = \"/etc/letsencrypt/live/mail.colinrozzi.com/fullchain.pem\""; print "key = \"/etc/letsencrypt/live/mail.colinrozzi.com/privkey.pem\"" }
              }
            ' "${actor_dir}/manifest.toml" > "$out"
            ASSETS+=("$out")
          }
          derive_manifest api-handler    inbox_api_handler    client "inbox-api-handler-${STAGE_TAG}.toml"
          derive_manifest mailbox        inbox_mailbox        ""     "inbox-mailbox-${STAGE_TAG}.toml"
          derive_manifest mailbox-router inbox_mailbox_router ""     "inbox-mailbox-router-${STAGE_TAG}.toml"
          derive_manifest smtp-acceptor  inbox_smtp_acceptor  ""     "inbox-smtp-acceptor-${STAGE_TAG}.toml"
          derive_manifest smtp-handler   inbox_smtp_handler   server "inbox-smtp-handler-${STAGE_TAG}.toml"

          # 3) Bundle of all six actor modules (humans / local use) + sha256.
          STAGE="inbox-${STAGE_TAG}-wasm32"
          mkdir -p "$STAGE"
          for actor in \
            inbox_acceptor \
            inbox_api_handler \
            inbox_mailbox \
            inbox_mailbox_router \
            inbox_smtp_acceptor \
            inbox_smtp_handler
          do
            cp "$(realpath result)/${actor}.wasm" "$STAGE/"
          done
          chmod -R +w "$STAGE"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

          gh release upload "$TAG" "${ASSETS[@]}" "$STAGE.tar.gz" "$STAGE.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
