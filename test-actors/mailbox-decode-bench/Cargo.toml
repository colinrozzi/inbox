[package]
name = "mailbox-decode-bench"
version = "0.1.0"
edition = "2021"

# Standalone: detach from the inbox workspace so this test bench never ships as
# a deployable actor.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.10.4 = the decoder fix (transient peak-clone ~7x -> ~2.2x). The bench sweep
# should now FLATTEN where 0.10.2 hit the ~7.4MB capped-heap cliff at N~800.
packr-guest = { version = "=0.10.4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
