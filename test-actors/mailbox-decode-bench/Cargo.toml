[package]
name = "mailbox-decode-bench"
version = "0.1.0"
edition = "2021"

# Standalone: detach from the inbox workspace so this test bench never ships as
# a deployable actor.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin EXACTLY 0.10.2 to match prod's mailbox + the 0.10.2 compose/runtime
# (avoid resolving 0.10.3 and an ABI mismatch with the pinned theater).
packr-guest = { version = "=0.10.2", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
