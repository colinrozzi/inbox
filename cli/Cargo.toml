[package]
name = "inbox-cli"
version = "0.1.0"
edition = "2021"
description = "Native HTTPS client for the inbox mail server API (replaces the wasm-spawn wrapper)."

# Standalone crate (NOT a member of the wasm-guest workspace): a native binary
# that talks the inbox HTTP API directly (bearer token + rustls). No theater, no
# wasm — a separate dependency tree from the actor crates. Empty [workspace]
# makes it its own workspace root (own Cargo.lock), mirroring supervisor's cli.
[workspace]

[[bin]]
name = "inbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# ureq 2.x: blocking HTTP + rustls (default "tls" feature) with bundled Mozilla
# roots — no system CA / OpenSSL dep, so it packages static-musl cleanly (ring
# needs the musl cross-cc, set in release.yml). No async runtime for a one-shot CLI.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
