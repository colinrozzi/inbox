[package]
name = "inbox-cli"
version = "0.1.0"
edition = "2021"
description = "Native HTTPS client for the inbox mail server API (replaces the wasm-spawn wrapper)."

# Standalone crate (NOT a member of the wasm-guest workspace): a native binary
# that talks the inbox HTTP API directly (bearer token + rustls). No theater, no
# wasm — a separate dependency tree from the actor crates. Empty [workspace]
# makes it its own workspace root (own Cargo.lock), mirroring supervisor's cli.
[workspace]

[[bin]]
name = "inbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Hand-rolled HTTP/1.1 over rustls (ring backend, bundled Mozilla roots) — the
# request MUST go out as one write (see http() in main.rs). ring + musl needs the
# cross-cc set in release-cli.yml. No async runtime for a one-shot CLI.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
