# Deploy template for inbox-acceptor (http-pull / supervisor-managed).
#
# Rendered by literal substring substitution of the __PLACEHOLDER__ tokens
# below from per-deploy config at render/apply time:
#
#   __PACKAGE__                 canonical inbox_acceptor-<tag>.wasm URL (release asset)
#   __LISTEN_ADDR__             host:port the HTTPS API binds (see note)
#   __API_HANDLER_MANIFEST__    https URL of the api-handler release-asset manifest
#   __MAILBOX_MANIFEST__        https URL of the mailbox release-asset manifest
#   __ROUTER_MANIFEST__         https URL of the mailbox-router release-asset manifest
#   __SMTP_ACCEPTOR_MANIFEST__  https URL of the smtp-acceptor release-asset manifest
#   __SMTP_HANDLER_MANIFEST__   https URL of the smtp-handler release-asset manifest
#
# SECRETS ARE NOT IN THIS TEMPLATE (PR #78, secrets-reader flip). The acceptor
# no longer carries bearer/dkim in initial_state — it READS them from the store
# labels `api-bearer-token` + `dkim-key` at init as a gatekeeper (it refuses to
# start if either is absent/empty). Secrets are seeded into the on-box store
# ONCE, out-of-band (operator/manager-owned), never through this template or any
# published manifest. That is exactly what makes this manifest safe to publish
# over http for pull-based deploys.
#
# OPERATOR NOTE — LISTEN_ADDR:
#   host:port the HTTPS API binds on this host. With the frontdoor in front,
#   "127.0.0.1:8443" (loopback; frontdoor owns the public :443 and SNI-routes
#   the raw encrypted stream to this backend). The backend still terminates TLS
#   using the cert/key in [handler.server_tls] below, regardless of bind address.
#
# OPERATOR NOTE — MANIFEST REFERENCES:
#   *_MANIFEST values are references theater's resolve_reference dispatches:
#     - https://... URLs        — release artifacts (production http-pull)
#     - file paths              — dev/legacy
#     - store://... references  — pre-staged
#   For http-pull deploys, all five are https:// URLs pointing at the matching
#   release-asset manifest TOMLs (generated by .github/workflows/release.yml).
#
# WHY initial_state IS A SINGLE-LINE TOML LITERAL (not multi-line):
#   When this template is embedded as a STRING value inside an outer manifest
#   that uses TOML triple-quote literal syntax, a nested triple-quote here would
#   close the wrapping string early ("expected newline" at the inner quote). A
#   2026-05-31 cutover attempt hit exactly this and rolled back. Keep
#   initial_state a single-line single-quote literal; don't re-introduce
#   multi-line for "readability".

name = "inbox-acceptor"
version = "0.1.0"
package = "__PACKAGE__"
# initial_state JSON (one-line for nesting-safety; see note above) — NON-SECRET:
#   {
#     "listen_addr":            "<host:port for HTTPS bind>",
#     "api_handler_manifest":   "<https reference>",
#     "mailbox_manifest":       "<https reference>",
#     "router_manifest":        "<https reference>",
#     "smtp_acceptor_manifest": "<https reference>",
#     "smtp_handler_manifest":  "<https reference>"
#   }
initial_state = '{"listen_addr":"__LISTEN_ADDR__","api_handler_manifest":"__API_HANDLER_MANIFEST__","mailbox_manifest":"__MAILBOX_MANIFEST__","router_manifest":"__ROUTER_MANIFEST__","smtp_acceptor_manifest":"__SMTP_ACCEPTOR_MANIFEST__","smtp_handler_manifest":"__SMTP_HANDLER_MANIFEST__"}'

[[handler]]
type = "self"

[[handler]]
type = "tcp"

# server_tls terminates TLS for the HTTPS API. cert+key are the certbot
# fullchain/privkey on the VPS (the same pair smtp-handler uses for STARTTLS on
# :25). If the deploy target moves off this host these become per-host config.
[handler.server_tls]
enabled = true
cert = "/etc/letsencrypt/live/mail.colinrozzi.com/fullchain.pem"
key = "/etc/letsencrypt/live/mail.colinrozzi.com/privkey.pem"

[[handler]]
type = "runtime"

[[handler]]
type = "rpc"

[[handler]]
type = "store"
base_path = "/mnt/main-volume/inbox/store"
store_id = "inbox"

# Children (router, api-handler, smtp-acceptor) are spawned via the runtime
# handler; inherit grants them the acceptor's capability set.
[permission_policy.runtime]
type = "inherit"
