# Plain self-contained actor (packr 0.11.0). Supersedes the 0.10.2 fixed-base
# recipe entirely — no compose, no fused allocator, no fixed base. packr 0.11.0
# links the allocator + growable own-memory into the cdylib directly, so the
# only link-args needed are:
#   --export-memory : export the module's own linear memory (growable; the
#                     growable heap is what retires the 0.10.2 capped-heap decode
#                     OOM class that blocked the mail-spine flip).
#   --no-entry      : wasm reactor, no _start.
# The resulting target/wasm32-unknown-unknown/release/<name>.wasm is directly
# loadable by theater 0.11.0 — there is NO `theater compose` step and no
# binaryen/wasm-merge dependency.
#
# NOTE: crane does NOT honor this file (kept for devshell / plain-cargo builds);
# flake.nix passes the same two link-args via CARGO_ENCODED_RUSTFLAGS. Keep the
# two in sync.
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--export-memory",
    "-C", "link-arg=--no-entry",
]
